name: Localization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package.nls.json
      - src/**/*.ts
      - external/vscode-common-python-lsp
      - .gitmodules
      - .nvmrc
      - .github/workflows/localization.yml

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/npm/registry/

concurrency:
  group: localization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localization:
    if: github.repository == 'microsoft/vscode-mypy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout feed authentication action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-actions
          sparse-checkout: |
            /.github/actions/authenticate-feeds/
            /build/setup-github-feeds.js
            /build/package-feeds.json
          sparse-checkout-cone-mode: false

      - name: Authenticate package feeds
        uses: ./ci-actions/.github/actions/authenticate-feeds

      - uses: microsoft/vscode-python-ci/actions/localization@f078b68e968b56e0a22d6cf803bb241a6b094994
        with:
          app-id: ${{ vars.PYTHON_LOCALIZATION_APP_ID }}
          private-key: ${{ secrets.PYTHON_LOCALIZATION_PRIVATE_KEY }}
          submodules: recursive
          source-paths: '["src", "external/vscode-common-python-lsp/typescript/src"]'
          node-version: '24.17.0'
          npm-registry: ${{ env.NPM_CONFIG_REGISTRY }}
